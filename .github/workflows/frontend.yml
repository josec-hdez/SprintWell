name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - '.github/workflows/frontend.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'shared/**'
      - '.github/workflows/frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect tooling
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has-tooling=true" >> "$GITHUB_OUTPUT"
            echo "Tooling detected: frontend/package.json exists."
          else
            echo "has-tooling=false" >> "$GITHUB_OUTPUT"
            echo "No tooling yet (frontend/package.json missing) — skipping lint and test."
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.has-tooling == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.has-tooling == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        if: steps.detect.outputs.has-tooling == 'true'
        run: npm run lint --if-present

      - name: API client up to date
        if: steps.detect.outputs.has-tooling == 'true'
        run: |
          npm run generate:api
          if ! git diff --exit-code src/api/generated; then
            echo "::error::Generated API client is stale. Run 'npm run generate:api' and commit the result."
            exit 1
          fi

      - name: Test
        if: steps.detect.outputs.has-tooling == 'true'
        run: npm test --if-present -- --run --passWithNoTests

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        # The specs mock the backend via route interception and run against
        # `vite dev`, so no database / backend / optimizer is needed here.
        run: npm run test:e2e
