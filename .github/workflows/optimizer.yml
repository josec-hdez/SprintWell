name: Optimizer CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'optimizer/**'
      - '.github/workflows/optimizer.yml'
  push:
    branches: [main]
    paths:
      - 'optimizer/**'
      - '.github/workflows/optimizer.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: optimizer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect tooling
        id: detect
        run: |
          if [ -f pyproject.toml ]; then
            echo "has-tooling=true" >> "$GITHUB_OUTPUT"
            echo "Tooling detected: optimizer/pyproject.toml exists."
          else
            echo "has-tooling=false" >> "$GITHUB_OUTPUT"
            echo "No tooling yet (optimizer/pyproject.toml missing) — skipping lint and test."
          fi

      - name: Setup Python
        if: steps.detect.outputs.has-tooling == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: optimizer/pyproject.toml

      - name: Install dependencies
        if: steps.detect.outputs.has-tooling == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if pip install -e ".[dev]" 2>/dev/null; then
            echo "Installed with [dev] extras."
          else
            echo "No [dev] extras found — falling back to plain editable install."
            pip install -e .
          fi

      - name: Lint
        if: steps.detect.outputs.has-tooling == 'true'
        shell: bash
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check .
          else
            echo "ruff not installed — skipping lint."
          fi

      - name: Test
        if: steps.detect.outputs.has-tooling == 'true'
        shell: bash
        run: |
          set +e
          pytest --quiet
          status=$?
          # pytest exit code 5 = no tests collected; treat as success for week-1 scaffold
          if [ "$status" -eq 5 ]; then
            echo "pytest collected no tests — treating as success."
            exit 0
          fi
          exit "$status"
