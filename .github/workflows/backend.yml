name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect tooling
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has-tooling=true" >> "$GITHUB_OUTPUT"
            echo "Tooling detected: backend/package.json exists."
          else
            echo "has-tooling=false" >> "$GITHUB_OUTPUT"
            echo "No tooling yet (backend/package.json missing) — skipping lint and test."
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.has-tooling == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.has-tooling == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint
        if: steps.detect.outputs.has-tooling == 'true'
        run: npm run lint --if-present

      - name: Test
        if: steps.detect.outputs.has-tooling == 'true'
        run: npm test --if-present -- --passWithNoTests

      - name: Test (e2e)
        if: steps.detect.outputs.has-tooling == 'true'
        run: npm run test:e2e --if-present -- --passWithNoTests

      - name: OpenAPI spec up to date
        if: steps.detect.outputs.has-tooling == 'true'
        run: |
          npm run openapi:export
          if ! git -C "$GITHUB_WORKSPACE" diff --exit-code shared/openapi.json; then
            echo "::error::shared/openapi.json is stale. Run 'npm run openapi:export' and commit the result."
            exit 1
          fi
